<!--
README :
~/studio/tickettoride$ python3 -m http.server
Access http://localhost:8000/misc/editor.html
then choose the map name code and select the tickettoride root folder on the prompt
-->
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="./editor.css">
    </head>
    <body>
        <div class="fieldsets">
            <fieldset>
                <legend>Map</legend>
                <input type="text" id="map-code" value="usa" /><button type="button" id="load-map" onclick="load()">Select TTR folder</button>
            </fieldset>
            <fieldset>
                <legend>Selected city</legend>
                Name <input type="text" id="selected-city-name" value="" />
            </fieldset>
            <fieldset>
                <legend>Selected route</legend>
                From <select id="route-from"></select>
                To <select id="route-to"></select>
                Color <select id="route-color"></select>
                Tunnel <input type="checkbox" id="route-tunnel" />
                Locomotives <input type="number" id="route-locomotives" />
                <span class="specific-route-field" data-route-argument="canPayWithAnySetOfCards" hidden>Any-card set <input type="number" id="route-can-pay-with-any-set-of-cards" /></span>
                <span class="specific-route-field" data-route-argument="mountain" hidden>Mountain <input type="number" id="route-mountain" /></span>
                <span class="specific-route-field" data-route-argument="stockShares" hidden>Stock shares <input type="text" id="route-stock-shares" /></span>
                <span class="specific-route-field" data-route-argument="bulletTrainSpaceIndex" hidden>Bullet train <input type="checkbox" id="route-bullet-train-space-index" /></span>
                <span class="specific-route-field" data-route-argument="ferryWaves" hidden>Ferry waves <input type="number" id="route-ferry-waves" /></span>
            </fieldset>
        </div>
        <div class="fieldsets">
            <fieldset>
                <legend>New map</legend>
                <button type="button" onclick="eraseAllRoutes()">Erase all routes</button>
            </fieldset>
            <fieldset>
                <legend>New City</legend>
                Id <input type="number" id="new-city-id" value="1" />
                Name <input type="text" id="new-city-name" value="" />
                <button type="button" onclick="createNewCity()">Create new city</button>
            </fieldset>
            <fieldset>
                <legend>New route</legend>
                From <select id="new-route-from"></select>
                To <select id="new-route-to"></select>
                Color <select id="new-route-color"></select>
                Tunnel <input type="checkbox" id="new-route-tunnel" />
                Number of spaces <input type="number" id="new-route-spaces" value="1" />
                Locomotives <input type="number" id="new-route-locomotives" value="0" />
                <span class="specific-route-field" data-route-argument="canPayWithAnySetOfCards" hidden>Any-card set <input type="number" id="new-route-can-pay-with-any-set-of-cards" /></span>
                <span class="specific-route-field" data-route-argument="mountain" hidden>Mountain <input type="number" id="new-route-mountain" value="0" /></span>
                <span class="specific-route-field" data-route-argument="stockShares" hidden>Stock shares <input type="text" id="new-route-stock-shares" value="[]" /></span>
                <span class="specific-route-field" data-route-argument="ferryWaves" hidden>Ferry waves <input type="number" id="new-route-ferry-waves" value="0" /></span>
                <button type="button" onclick="createNewRoute()">Create new route</button>
            </fieldset>
        </div>

        <div id="map">
            <div id="cities"></div>
            <div id="route-spaces"></div>
        </div>

        <div class="fieldsets">
            <fieldset>
                <legend>Cities export</legend>
                <textarea id="cities-export" rows="20" style="width: 800px"></textarea>
            </fieldset>
            <fieldset>
                <legend>Routes export</legend>
                <textarea id="routes-export" rows="20" style="width: 800px"></textarea>
            </fieldset>
        </div>

        <script type="text/javascript" src="./editor.js"></script>
    </body>
</html>
